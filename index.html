<script>
// Before anything draws: the saved theme's paper colour and the status bar's
// ink (light text on dark paper, dark text on cream), so nothing flashes.
(function () {
  var s = {}; try { s = JSON.parse(localStorage.getItem("settings")) || {}; } catch (e) {}
  var mode = s.mode || "SYSTEM";
  var dark = mode === "DARK" || (mode !== "LIGHT" && matchMedia("(prefers-color-scheme: dark)").matches);
  var bg = { CLASSIC: ["#F5EFE5", "#181613"], OCEAN: ["#F3F0E8", "#13171B"], SUNSET: ["#F6EFE4", "#191512"],
    ORCHID: ["#F4F0EA", "#17151D"], FOREST: ["#F2F0E6", "#141915"] }[s.theme || "OCEAN"] || ["#F3F0E8", "#13171B"];
  var c = dark ? bg[1] : bg[0];
  document.documentElement.style.setProperty("--bg", c);
  document.documentElement.style.background = c;
  document.querySelector('meta[name="theme-color"]').setAttribute("content", c);
  if (!dark) document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute("content", "default");
  // Start fetching the app's own typeface and the reader's chosen reading font
  // now, so no page ever draws in a stand-in font first (see font-display: block).
  var file = { LITERATA: "literata", MERRIWEATHER: "merriweather", OUTFIT: "outfit", FRAUNCES: "fraunces", LORA: "lora",
    PLAYFAIR: "playfair", INTER: "inter", DM_SANS: "dm_sans", POPPINS: "poppins", MANROPE: "manrope", ALEGREYA: "alegreya",
    PLUS_JAKARTA: "jakarta", HANKEN: "hanken" }[s.font || "LITERATA"] || "literata";
  ["outfit_regular", "outfit_semibold", "outfit_bold", "inter_regular", file + "_regular", file + "_semibold", file + "_bold"]
    .filter(function (f, i, a) { return a.indexOf(f) === i; })
    .forEach(function (f) {
      var l = document.createElement("link");
      l.rel = "preload"; l.as = "font"; l.type = "font/ttf"; l.crossOrigin = "anonymous"; l.href = "fonts/" + f + ".ttf";
      document.head.appendChild(l);
    });
})();
</script>
</head>

     the home logo once the words are ready (see Motion.liftSplash). -->

<svg viewBox="0 0 108 108"><defs>

<linearGradient id="sg2" gradientUnits="userSpaceOnUse" x1="54" y1="42.95" x2="68.95" y2="75.45"><stop offset="0" stop-color="#B57CF5"/><stop offset="1" stop-color="#8A56E6"/></linearGradient>
<linearGradient id="sg3" gradientUnits="userSpaceOnUse" x1="39.05" y1="75.45" x2="54" y2="42.95"><stop offset="0" stop-color="#2B5FD9"/><stop offset="1" stop-color="#3D86EE"/></linearGradient>
<linearGradient id="sg4" gradientUnits="userSpaceOnUse" x1="68.95" y1="75.45" x2="83.9" y2="32.55"><stop offset="0" stop-color="#E0588F"/><stop offset="1" stop-color="#F57BA8"/></linearGradient>
</defs><g fill="none" stroke-width="14.3" stroke-linecap="round" transform="translate(54 54) scale(0.62) translate(-54 -54)">
<path d="M24.1 32.55L39.05 75.45" stroke="url(#sg1)"/><path d="M54 42.95L68.95 75.45" stroke="url(#sg2)"/>
<path d="M39.05 75.45L54 42.95" stroke="url(#sg3)"/><path d="M68.95 75.45L83.9 32.55" stroke="url(#sg4)"/></g></svg>
</div></div>
